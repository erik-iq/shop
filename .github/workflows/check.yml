name: Vérifier la boutique
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run package
      - name: Vérifier la distribution enregistrée
        run: git diff --exit-code -- downloads/
      - uses: actions/upload-artifact@v4
        with:
          name: Informaquik-Shop
          path: downloads/
